<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta AR - Kevin Sanchez Robles</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #aviso {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #00f0ff; padding: 8px 16px;
      border-radius: 20px; font-size: 14px; z-index: 10; text-align: center;
    }
    .links {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; gap: 10px; z-index: 10;
    }
    .links a {
      background: #00f0ff; color: #000; text-decoration: none; font-weight: bold;
      padding: 12px 18px; border-radius: 10px; font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="aviso">Apunta la cámara al marcador de la tarjeta</div>

  <!-- Botones que aparecen al detectar el marcador del FRENTE -->
  <div class="links" id="links-frente">
    <a href="https://www.linkedin.com/in/kevin-sanchez-robles-07140843b/" target="_blank">LinkedIn</a>
    <a href="https://github.com/Keiken5000/Proyectos" target="_blank">Proyectos</a>
  </div>

  <!-- Botones que aparecen al detectar el marcador del REVERSO -->
  <div class="links" id="links-reverso">
    <a href="https://github.com/Keiken5000/Proyectos" target="_blank">Portafolio de proyectos</a>
  </div>

  <a-scene embedded
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true;"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <!-- FRENTE: marcador Hiro personalizado (archivo .patt generado con TU imagen) -->
    <a-marker id="marcador-frente" type="pattern" url="marcador-frente.patt">
      <!-- Foto -->
      <a-image src="foto.jpg" position="-1.1 0 0" rotation="-90 0 0" width="1.2" height="1.2"></a-image>
      <!-- Panel de texto -->
      <a-plane position="0.7 0 0" rotation="-90 0 0" width="2.2" height="1.6" color="#050a14" opacity="0.85"></a-plane>
      <a-text value="Kevin Sanchez Robles" position="0.7 0.01 -0.55" rotation="-90 0 0" align="center" color="#00f0ff" width="2"></a-text>
      <a-text value="Futuro Ing. en Computacion y Audio" position="0.7 0.01 -0.3" rotation="-90 0 0" align="center" color="#ffffff" width="1.8"></a-text>
      <a-text value="Tel: +52 492 174 2258" position="0.7 0.01 0" rotation="-90 0 0" align="center" color="#39ff88" width="1.8"></a-text>
      <a-text value="kevin223.10@hotmail.es" position="0.7 0.01 0.25" rotation="-90 0 0" align="center" color="#39ff88" width="1.8"></a-text>
      <a-text value="LinkedIn y GitHub: botones abajo" position="0.7 0.01 0.55" rotation="-90 0 0" align="center" color="#aaaaaa" width="1.6"></a-text>
    </a-marker>

    <!-- REVERSO: segundo marcador (otra imagen tuya convertida a .patt) -->
    <a-marker id="marcador-reverso" type="pattern" url="marcador-reverso.patt">
      <a-plane position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4" color="#050a14" opacity="0.85"></a-plane>
      <a-text value="Mas informacion" position="0 0.01 -0.35" rotation="-90 0 0" align="center" color="#00f0ff" width="2.2"></a-text>
      <a-text value="Portafolio de proyectos en GitHub" position="0 0.01 0.05" rotation="-90 0 0" align="center" color="#ffffff" width="2"></a-text>
      <a-text value="Toca el boton de abajo" position="0 0.01 0.4" rotation="-90 0 0" align="center" color="#39ff88" width="1.8"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Muestra u oculta los botones según el marcador detectado
    function enlazar(idMarcador, idBotones) {
      const m = document.getElementById(idMarcador);
      const b = document.getElementById(idBotones);
      m.addEventListener('markerFound', () => {
        b.style.display = 'flex';
        document.getElementById('aviso').style.display = 'none';
      });
      m.addEventListener('markerLost', () => {
        b.style.display = 'none';
        document.getElementById('aviso').style.display = 'block';
      });
    }
    enlazar('marcador-frente', 'links-frente');
    enlazar('marcador-reverso', 'links-reverso');
  </script>
</body>
</html>
